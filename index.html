<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Notas - Rediseño UX/UI</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main class="container">
        <h1>Gestor de Notas UX</h1>
        <p class="subtitle">Organiza tus pendientes de forma rápida y accesible.</p>

        <form id="notaForm">
            <div class="field-group">
                <label for="tituloNota">Título de la nota</label>
                <input type="text" id="tituloNota" placeholder="Ej. Comprar materiales" required>
            </div>

            <div class="field-group">
                <label for="contenidoNota">Contenido</label>
                <textarea id="contenidoNota" placeholder="Escribe tu nota aquí..." required></textarea>
            </div>

            <button type="submit" class="btn-primary">Guardar Nota</button>
        </form>

        <div id="mensajeEstado" class="status-message" aria-live="polite"></div>
    </main>
    <script src="app.js"></script>
</body>
</html>
